name: Build and Release

# Runs on every push to main — i.e. after every commit that lands on main
# (including merged PRs). Each run gets its own monotonically increasing
# version number derived from the workflow run number, builds the phone,
# Wear OS, and native desktop (Linux) apps, tags the commit, and publishes
# a GitHub Release with all artifacts attached.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {} # allows manually re-running from the Actions tab

# Prevent two releases from racing each other if commits land close together.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # needed to push tags and create releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so tagging/describe works cleanly

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Linux packaging dependencies (AppImage / FUSE)
        run: |
          sudo apt-get update
          # libfuse2 is required by appimagetool on Ubuntu runners
          sudo apt-get install -y libfuse2 binutils fakeroot

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          # No gradlew is committed (it ships a binary wrapper jar), so this
          # action provisions Gradle itself and we invoke `gradle` directly.

      - name: Compute version number
        id: version
        run: |
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="1.0.${{ github.run_number }}"
          TAG="v${VERSION_NAME}"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stamp version into phone, Wear, and desktop build files
        run: |
          for f in app/build.gradle.kts wear/build.gradle.kts; do
            sed -i "s/versionCode = [0-9]\+/versionCode = ${{ steps.version.outputs.code }}/" "$f"
            sed -i "s/versionName = \"[^\"]*\"/versionName = \"${{ steps.version.outputs.name }}\"/" "$f"
          done
          # Desktop packageVersion (Compose Desktop rejects 0.x for some targets)
          sed -i "s/packageVersion = \"[^\"]*\"/packageVersion = \"${{ steps.version.outputs.name }}\"/" desktop/build.gradle.kts
          # Embed version for in-app auto-update checks
          sed -i "s/?: \"1\.0\.0\"/?: \"${{ steps.version.outputs.name }}\"/" \
            desktop/src/jvmMain/kotlin/com/quickgit/desktop/data/DesktopAppUpdateManager.kt || true

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/quickgit-release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/quickgit-release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build phone + Wear release APKs
        run: gradle :app:assembleRelease :wear:assembleRelease --no-daemon

      - name: Build desktop Deb
        run: |
          gradle :desktop:packageDeb --no-daemon \
            -Pquickgit.version="${{ steps.version.outputs.name }}"

      - name: Build desktop AppImage
        run: |
          # AppImage packaging needs FUSE; libfuse2 installed above.
          # Continue the job even if AppImage fails so Deb still ships.
          set +e
          gradle :desktop:packageAppImage --no-daemon \
            -Pquickgit.version="${{ steps.version.outputs.name }}"
          APPIMAGE_RC=$?
          set -e
          if [ "$APPIMAGE_RC" -ne 0 ]; then
            echo "WARNING: packageAppImage failed with exit $APPIMAGE_RC" >&2
            # Try alternative: package distribution and note missing AppImage
          fi

      - name: Locate and rename artifacts
        id: artifacts
        run: |
          set -euo pipefail

          # --- Android APKs ---
          PHONE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          WEAR_APK=$(find wear/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$PHONE_APK" ] || [ ! -f "$PHONE_APK" ]; then
            echo "Phone release APK not found under app/build/outputs/apk/release" >&2
            exit 1
          fi
          if [ -z "$WEAR_APK" ] || [ ! -f "$WEAR_APK" ]; then
            echo "Wear release APK not found under wear/build/outputs/apk/release" >&2
            exit 1
          fi
          PHONE_OUT="quickgit-${{ steps.version.outputs.name }}.apk"
          WEAR_OUT="quickgit-wear-${{ steps.version.outputs.name }}.apk"
          cp "$PHONE_APK" "$PHONE_OUT"
          cp "$WEAR_APK" "$WEAR_OUT"
          echo "phone_path=$PHONE_OUT" >> "$GITHUB_OUTPUT"
          echo "wear_path=$WEAR_OUT" >> "$GITHUB_OUTPUT"
          echo "Phone APK: $PHONE_OUT ($(stat -c%s "$PHONE_OUT") bytes)"
          echo "Wear APK:  $WEAR_OUT ($(stat -c%s "$WEAR_OUT") bytes)"

          # --- Desktop packages ---
          DEB=$(find desktop/build/compose/binaries -name '*.deb' 2>/dev/null | head -n 1 || true)
          APPIMAGE=$(find desktop/build/compose/binaries -name '*.AppImage' 2>/dev/null | head -n 1 || true)

          FILES_LIST="$PHONE_OUT"$'\n'"$WEAR_OUT"

          if [ -n "$DEB" ] && [ -f "$DEB" ]; then
            DEB_OUT="quickgit-${{ steps.version.outputs.name }}-linux-amd64.deb"
            cp "$DEB" "$DEB_OUT"
            echo "deb_path=$DEB_OUT" >> "$GITHUB_OUTPUT"
            FILES_LIST="$FILES_LIST"$'\n'"$DEB_OUT"
            echo "Deb:      $DEB_OUT ($(stat -c%s "$DEB_OUT") bytes)"
          else
            echo "WARNING: .deb not found — desktop packageDeb may have failed" >&2
          fi

          if [ -n "$APPIMAGE" ] && [ -f "$APPIMAGE" ]; then
            APPIMAGE_OUT="quickgit-${{ steps.version.outputs.name }}-linux-x86_64.AppImage"
            cp "$APPIMAGE" "$APPIMAGE_OUT"
            chmod +x "$APPIMAGE_OUT"
            echo "appimage_path=$APPIMAGE_OUT" >> "$GITHUB_OUTPUT"
            FILES_LIST="$FILES_LIST"$'\n'"$APPIMAGE_OUT"
            echo "AppImage: $APPIMAGE_OUT ($(stat -c%s "$APPIMAGE_OUT") bytes)"
          else
            echo "WARNING: .AppImage not found — desktop packageAppImage may have failed" >&2
          fi

          # Export newline-separated list for the release step
          {
            echo "files<<ARTIFACT_EOF"
            echo "$FILES_LIST"
            echo "ARTIFACT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Tag the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: QuickGit ${{ steps.version.outputs.name }}
          body: |
            Automated build from commit ${{ github.sha }}.

            **Artifacts**
            - `quickgit-${{ steps.version.outputs.name }}.apk` — phone / tablet (Android)
            - `quickgit-wear-${{ steps.version.outputs.name }}.apk` — Wear OS
            - `quickgit-${{ steps.version.outputs.name }}-linux-amd64.deb` — native Linux (.deb)
            - `quickgit-${{ steps.version.outputs.name }}-linux-x86_64.AppImage` — native Linux (AppImage)

            **Desktop auto-update:** the .deb / AppImage builds check this Releases page for newer packages.

            **Commit message:**
            ${{ github.event.head_commit.message }}
          files: ${{ steps.artifacts.outputs.files }}
